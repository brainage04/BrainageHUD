plugins {
	id 'dev.architectury.loom-no-remap'
	id 'dev.architectury.loom'
	id 'io.github.brainage04.workspace-dependencies' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.mod-publishing' version "${fabricmoddingconventions_version}"
}

base { archivesName = "${rootProject.archives_base_name}-neoforge" }

loom {
	neoForge { }
	mods { main { sourceSet sourceSets.main; sourceSet project(':common').sourceSets.main } }
	runs { client { runDir 'run/client' } }
}

configurations {
	common { canBeResolved = true; canBeConsumed = false }
	compileClasspath.extendsFrom common
}

workspaceDependencies {
	siblingMaven('HudRendererLib') { coordinate.set("io.github.brainage04:hudrendererlib-neoforge:${rootProject.hudrendererlib_version}"); siblingDirectory.set(rootProject.layout.projectDirectory.dir('../HudRendererLib')) }
}

modPublishing {
	version.set("${rootProject.mod_version}-neoforge")
	releaseTag.set("v${rootProject.mod_version}")
	displayName.set("${rootProject.mod_name} ${rootProject.mod_version} (NeoForge)")
	modLoaders.set(['neoforge'])
	fabricModJson.set(rootProject.layout.projectDirectory.file('fabric/build/resources/main/fabric.mod.json'))
	licenseFile.set(rootProject.layout.projectDirectory.file('LICENSE'))
	modrinth.projectConfig.set(rootProject.layout.projectDirectory.file('.modrinth/project.json'))
	modrinth.projectBody.set(rootProject.layout.projectDirectory.file('README.md'))
	modrinth.iconFile.set(rootProject.layout.projectDirectory.file('src/main/resources/assets/brainagehud/icon.png'))
}

tasks.named('validateModPublication') {
	dependsOn ':fabric:processResources'
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
	common(project(':common')) { transitive = false }
	implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"
	if (providers.gradleProperty('use_local_hudrendererlib').map { it.toBoolean() }.getOrElse(false)) {
		implementation "io.github.brainage04:hudrendererlib-neoforge:${rootProject.hudrendererlib_version}"
	} else {
		implementation "github.brainage04:hudrendererlib-neoforge:${rootProject.hudrendererlib_version}"
	}
}

tasks.named('jar') {
	from project(':common').sourceSets.main.output
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(rootProject.file('LICENSE')) { rename { "${it}_${rootProject.archives_base_name}-neoforge" } }
}
tasks.named('sourcesJar') { from project(':common').sourceSets.main.allSource }
tasks.matching { it.name.startsWith('run') }.configureEach { dependsOn project(':common').tasks.named('jar') }
