modLoader="javafml"
loaderVersion="[11,)"
license="MIT"
issueTrackerURL="https://github.com/brainage04/BrainageHUD/issues"

[[mods]]
modId="brainagehud"
version="${version}"
displayName="BrainageHUD"
description="A NeoForge mod that adds useful HUD elements to Minecraft."
logoFile="assets/brainagehud/icon.png"
authors="brainage04"
displayURL="https://github.com/brainage04/BrainageHUD"

[[mixins]]
config="brainagehud.client.mixins.json"

[[dependencies.brainagehud]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.brainagehud]]
modId="minecraft"
type="required"
versionRange="${neoforge_minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.brainagehud]]
modId="cloth_config"
type="required"
versionRange="[${cloth_config_version},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.brainagehud]]
modId="hudrendererlib"
type="required"
versionRange="[${hudrendererlib_version},)"
ordering="AFTER"
side="CLIENT"
