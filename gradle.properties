mod_side=client
# Mod Properties
mod_version=1.0.3
mod_id=brainagehud
maven_group=io.github.brainage04
archives_base_name=brainagehud
mod_name=BrainageHUD

# Dependencies
fabric_api_version=0.156.0+26.2
cloth_config_version=26.2.155
modmenu_version=20.0.1
hudrendererlib_version=1.0.9
fabricmoddingconventions_version=2.4.12
