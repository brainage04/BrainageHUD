name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  distribution:
    permissions:
      contents: write
    uses: brainage04/MinecraftModConventions/.github/workflows/reusable-multiloader-release.yml@v3.1.2
    with:
      prepare_siblings: HudRendererLib
      additional_artifact_pattern: brainagehud-neoforge-*.jar
      release_name: ${{ format('BrainageHUD {0}', github.ref_name) }}
      modrinth_project_id: ${{ vars.MODRINTH_PROJECT_ID }}
      publish_curseforge: false
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
      modrinth_token: ${{ secrets.MODRINTH_TOKEN }}
