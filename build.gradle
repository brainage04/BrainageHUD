plugins {
	id 'dev.architectury.loom-no-remap' version "${architectury_loom_version}" apply false
	id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
}

allprojects {
	group = rootProject.maven_group
	version = rootProject.mod_version
}

subprojects {
	apply plugin: 'java'

	repositories {
		mavenLocal()
		maven { url = uri('https://maven.architectury.dev/') }
		maven { url = uri('https://maven.neoforged.net/releases/') }
		maven { url = uri('https://maven.fabricmc.net/') }
		maven { url = uri('https://maven.shedaniel.me/') }
		maven { url = uri('https://api.modrinth.com/maven/') }
		mavenCentral()
		ivy {
			name = 'HudRendererLibGitHubRelease'
			url = "https://github.com/brainage04/HudRendererLib/releases/download/v${rootProject.hudrendererlib_version}"
			patternLayout { artifact '[artifact]-[revision].[ext]' }
			metadataSources { artifact() }
		}
	}

	java {
		toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
		withSourcesJar()
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = rootProject.java_version as int
	}

	tasks.withType(ProcessResources).configureEach {
		def metadataProperties = [
			version: rootProject.mod_version,
			minecraft_version: rootProject.minecraft_version,
			neoforge_version: rootProject.neoforge_version,
			hudrendererlib_version: rootProject.hudrendererlib_version,
			cloth_config_version: rootProject.cloth_config_version
		]
		inputs.properties(metadataProperties)
		filesMatching('META-INF/neoforge.mods.toml') {
			expand(metadataProperties)
		}
	}
}

def fabricReleaseJar = project(':fabric').tasks.named('jar', org.gradle.api.tasks.bundling.AbstractArchiveTask)
def neoForgeReleaseJar = project(':neoforge').tasks.named('jar', org.gradle.api.tasks.bundling.AbstractArchiveTask)

tasks.register('collectReleaseArtifacts', Sync) {
	dependsOn fabricReleaseJar, neoForgeReleaseJar
	from fabricReleaseJar.flatMap { it.archiveFile }
	from neoForgeReleaseJar.flatMap { it.archiveFile }
	into layout.buildDirectory.dir('libs')
}

tasks.register('build') {
	group = 'build'
	dependsOn subprojects.collect { it.tasks.named('build') }
	dependsOn tasks.named('collectReleaseArtifacts')
}
