plugins {
	id 'io.github.brainage04.client-gametest-recorder' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.production-gametests' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.workspace-dependencies' version "${fabricmoddingconventions_version}"
	id 'io.github.brainage04.mod-publishing' version "${fabricmoddingconventions_version}"
}

repositories {
	mavenLocal()

	// Cloth Config
	maven { url "https://maven.shedaniel.me/" }

	// Mod Menu
	maven { url "https://api.modrinth.com/maven/" }

	// HudRendererLib release fallback
	ivy {
		name = "HudRendererLibGitHubRelease"
		url = "https://github.com/brainage04/HudRendererLib/releases/download/v${project.hudrendererlib_version}"
		patternLayout {
			artifact "[artifact]-[revision].[ext]"
		}
		metadataSources {
			artifact()
		}
	}
}

workspaceDependencies {
	siblingMaven("FabricModdingConventions") {
		coordinate.set("io.github.brainage04:fabricmoddingconventions:${project.fabricmoddingconventions_version}")
	}
	siblingMaven("HudRendererLib") {
		coordinate.set("io.github.brainage04:hudrendererlib:${project.hudrendererlib_version}")
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

fabricModConventions {
	additionalFabricModJsonProperties.add("hudrendererlib_version")
}

dependencies {
	// Cloth Config
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Mod Menu
	implementation "maven.modrinth:modmenu:${project.modmenu_version}"

	// HudRendererLib: opt into sibling Maven output when requested, otherwise use the release fallback.
	if (providers.gradleProperty("use_local_hudrendererlib").map { it.toBoolean() }.getOrElse(false)) {
		implementation "io.github.brainage04:hudrendererlib:${project.hudrendererlib_version}"
	} else {
		implementation "github.brainage04:hudrendererlib:${project.hudrendererlib_version}"
	}
}

pluginManager.withPlugin("io.github.brainage04.client-gametest-recorder") {
	clientGameTestRecorder {
		minecraftOptionsVersion.set("4671")
		maxFps.set("30")
		renderDistance.set("5")
		simulationDistance.set("5")
		guiScale.set("3")
	}
}
